name: iOS platform runtime

on:
  pull_request:
    paths:
      - "core/**"
      - "build.gradle.kts"
      - ".github/workflows/ios-platform-test.yml"
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - "build.gradle.kts"
      - ".github/workflows/ios-platform-test.yml"

permissions:
  contents: read

concurrency:
  group: ios-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-platform:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Run iOS simulator-target tests
        run: ./gradlew :core:iosSimulatorArm64Test --no-daemon --stacktrace
