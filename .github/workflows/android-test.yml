name: Android unit tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install managed-device system image
        run: sdkmanager "system-images;android-30;aosp_atd;x86"

      - name: Run JVM unit tests and compile instrumentation tests
        run: gradle --no-daemon testDebugUnitTest assembleDebugAndroidTest

      - name: Run Android instrumentation tests on managed device
        run: gradle --no-daemon pixel2api30DebugAndroidTest
