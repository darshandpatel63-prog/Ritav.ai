name: Android unit tests

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-test.yml"

# New PR commits supersede older PR verification; main pushes are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install managed-device system image
        run: sdkmanager "system-images;android-30;aosp_atd;x86"

      - name: Enable Android emulator hardware acceleration
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable; managed-device x86 emulation cannot run on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run JVM unit tests and compile instrumentation tests
        run: gradle --no-daemon :core:jvmTest testDebugUnitTest assembleDebugAndroidTest

      - name: Run Android instrumentation tests on managed device
        run: gradle --no-daemon -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect pixel2api30DebugAndroidTest
