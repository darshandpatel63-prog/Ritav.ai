name: Android release validation

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "app/build.gradle.kts"
      - "app/proguard-rules.pro"
      - "core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/res/xml/**"
      - ".github/workflows/android-release.yml"
  push:
    branches: ["main"]
    paths:
      - "app/build.gradle.kts"
      - "core/**"
      - "app/proguard-rules.pro"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/res/xml/**"
      - ".github/workflows/android-release.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Verify release security configuration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          ANDROID_NS = "http://schemas.android.com/apk/res/android"

          manifest = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          application = manifest.find("application")
          if application is None:
              print("Missing <application> element.")
              sys.exit(1)

          expected_manifest = {
              "allowBackup": "false",
              "usesCleartextTraffic": "false",
              "fullBackupContent": "@xml/backup_rules_legacy",
              "dataExtractionRules": "@xml/data_extraction_rules",
          }
          missing_manifest = []
          for name, expected in expected_manifest.items():
              actual = application.get(f"{{{ANDROID_NS}}}{name}")
              if actual != expected:
                  missing_manifest.append(f"android:{name}={expected!r} (actual={actual!r})")

          release = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          required_release_lines = {
              "release debuggable": "isDebuggable = false",
              "release minification": "isMinifyEnabled = true",
              "release resource shrinking": "isShrinkResources = true",
          }
          missing_release = [name for name, needle in required_release_lines.items() if needle not in release]

          modern = ET.parse("app/src/main/res/xml/data_extraction_rules.xml").getroot()
          if modern.tag != "data-extraction-rules":
              missing_release.append("modern data-extraction-rules root")

          for section_name in ("cloud-backup", "device-transfer"):
              section = modern.find(section_name)
              if section is None:
                  missing_release.append(f"modern {section_name} section")
                  continue
              excluded = any(
                  child.tag == "exclude"
                  and child.get("domain") == "root"
                  and child.get("path") in (".", "./")
                  for child in section
              )
              if not excluded:
                  missing_release.append(f"modern {section_name} root exclusion")

          legacy = ET.parse("app/src/main/res/xml/backup_rules_legacy.xml").getroot()
          legacy_excluded = any(
              child.tag == "exclude"
              and child.get("domain") == "root"
              and child.get("path") in (".", "./")
              for child in legacy
          )
          if legacy.tag != "full-backup-content" or not legacy_excluded:
              missing_release.append("legacy root exclusion")

          if missing_manifest or missing_release:
              if missing_manifest:
                  print("Manifest security contract failures:")
                  for item in missing_manifest:
                      print(f" - {item}")
              if missing_release:
                  print("Release security contract failures:")
                  for item in missing_release:
                      print(f" - {item}")
              sys.exit(1)

          print("Release security configuration contract is present and structurally verified.")
          PY

      - name: Scan tracked source for embedded release secrets
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          patterns = (
              ("private-key", re.compile(rb"-----BEGIN(?: [A-Z0-9][A-Z0-9 ]{0,63})? PRIVATE KEY-----")),
              ("api-key-assignment", re.compile(rb"""(?i)(?:api[_ -]?key|access[_ -]?token|secret[_ -]?key)\s*[:=]\s*["'][^"']{12,}["']""")),
              ("password-assignment", re.compile(rb"""(?i)(?:password|passwd|passcode)\s*[:=]\s*["'](?!\$)[^"']{4,}["']""")),
              ("aws-access-key", re.compile(rb"\bAKIA[0-9A-Z]{16}\b")),
              ("github-token", re.compile(rb"\b(?:ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{70,})\b")),
              ("slack-token", re.compile(rb"\bxox[bp]-[A-Za-z0-9-]{20,}\b")),
              ("google-api-key", re.compile(rb"\bAIza[0-9A-Za-z_-]{35}\b")),
              ("openai-style-key", re.compile(rb"\bsk-[A-Za-z0-9_-]{20,}\b")),
          )

          violations = []
          for raw in tracked:
              if not raw:
                  continue
              path = raw.decode("utf-8")
              if path.startswith("app/src/test/") or path.startswith("app/src/androidTest/"):
                  continue

              data = pathlib.Path(path).read_bytes()
              if b"\0" in data:
                  continue

              for label, pattern in patterns:
                  match = pattern.search(data)
                  if match:
                      line = data[:match.start()].count(b"\n") + 1
                      violations.append((path, line, label))

          if violations:
              for path, line, label in violations:
                  print(f"Embedded secret pattern detected: {path}:{line} ({label})")
              sys.exit(1)

          risky_files = [
              path for path in (
                  raw.decode("utf-8") for raw in tracked if raw
              )
              if pathlib.PurePosixPath(path).suffix.lower() in {".jks", ".keystore", ".p12", ".pem", ".key"}
          ]
          if risky_files:
              for path in risky_files:
                  print(f"Tracked signing/secret material is forbidden: {path}")
              sys.exit(1)

          print("No embedded release-secret patterns or tracked signing material found in non-test sources.")
          PY

      - name: Generate ephemeral CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/ritav-ci-validation.jks"
          password="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          umask 077
          keytool -genkeypair             -keystore "$keystore"             -storepass "$password"             -keypass "$password"             -alias ritav-ci-validation             -keyalg RSA             -keysize 2048             -validity 2             -dname "CN=Ritav CI Validation, OU=Security, O=Ritav.ai, L=CI, S=CI, C=US"             -noprompt
          {
            echo "RITAV_SIGNING_STORE_FILE=$keystore"
            echo "RITAV_SIGNING_STORE_PASSWORD=$password"
            echo "RITAV_SIGNING_KEY_ALIAS=ritav-ci-validation"
            echo "RITAV_SIGNING_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
          keytool -list -keystore "$keystore" -storepass "$password" -alias ritav-ci-validation >/dev/null

      - name: Validate release unit tests and signed release build
        run: >
          gradle --no-daemon
          -PRITAV_SIGNING_STORE_FILE="$RITAV_SIGNING_STORE_FILE"
          -PRITAV_SIGNING_STORE_PASSWORD="$RITAV_SIGNING_STORE_PASSWORD"
          -PRITAV_SIGNING_KEY_ALIAS="$RITAV_SIGNING_KEY_ALIAS"
          -PRITAV_SIGNING_KEY_PASSWORD="$RITAV_SIGNING_KEY_PASSWORD"
          :core:jvmTest
          testDebugUnitTest
          testReleaseUnitTest
          lintRelease
          assembleRelease
          bundleRelease

      - name: Verify signed release artifacts and APK debug state
        shell: bash
        run: |
          set -euo pipefail

          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          mapping="app/build/outputs/mapping/release/mapping.txt"

          test -s "$apk"
          test -s "$aab"
          test -s "$mapping"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          jarsigner -verify -verbose -certs "$aab" >/tmp/ritav-aab-jarsigner.txt
          grep -q "jar verified" /tmp/ritav-aab-jarsigner.txt

          manifest_dump="$(mktemp)"
          trap 'rm -f "$manifest_dump"' EXIT
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$manifest_dump"

          if grep -Eqi 'android:debuggable[^\n]*(true|0xffffffff)' "$manifest_dump"; then
            echo "::error::Release APK is debug-enabled."
            exit 1
          fi

          cert_fingerprint="$(
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" |
              sed -n 's/Signer #1 certificate SHA-256 digest: //p' |
              head -n 1
          )"
          test -n "$cert_fingerprint"
          printf 'APK signer certificate SHA-256: %s\n' "$cert_fingerprint"

          sha256sum "$apk" "$aab" "$mapping" > release-SHA256SUMS.txt
          echo "Signed release artifacts:"
          ls -lh "$apk" "$aab" "$mapping" release-SHA256SUMS.txt
          echo "R8 mapping is present, release APK is signed, AAB signature verified, and release APK is not debug-enabled."

      - name: Upload signed release validation artifacts and mapping
        uses: actions/upload-artifact@v4
        with:
          name: ritav-android-release-validation
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            release-SHA256SUMS.txt
