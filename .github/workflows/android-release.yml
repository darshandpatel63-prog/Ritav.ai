name: Android release validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/build.gradle.kts"
      - "app/proguard-rules.pro"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/res/xml/**"
      - ".github/workflows/android-release.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Scan tracked source for embedded release secrets
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          patterns = (
              ("private-key", re.compile(rb"-----BEGIN(?: [A-Z0-9][A-Z0-9 ]{0,63})? PRIVATE KEY-----")),
              ("api-key-assignment", re.compile(rb"""(?i)(?:api[_ -]?key|access[_ -]?token|secret[_ -]?key)\s*[:=]\s*["'][^"']{12,}["']""")),
              ("password-assignment", re.compile(rb"""(?i)(?:password|passwd|passcode)\s*[:=]\s*["'][^"']{4,}["']""")),
              ("aws-access-key", re.compile(rb"\bAKIA[0-9A-Z]{16}\b")),
              ("github-token", re.compile(rb"\b(?:ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{70,})\b")),
              ("slack-token", re.compile(rb"\bxox[bp]-[A-Za-z0-9-]{20,}\b")),
              ("google-api-key", re.compile(rb"\bAIza[0-9A-Za-z_-]{35}\b")),
              ("openai-style-key", re.compile(rb"\bsk-[A-Za-z0-9_-]{20,}\b")),
          )

          violations = []
          for raw in tracked:
              if not raw:
                  continue
              path = raw.decode("utf-8")
              if path.startswith("app/src/test/") or path.startswith("app/src/androidTest/"):
                  continue

              data = pathlib.Path(path).read_bytes()
              if b"\0" in data:
                  continue

              for label, pattern in patterns:
                  match = pattern.search(data)
                  if match:
                      line = data[:match.start()].count(b"\n") + 1
                      violations.append((path, line, label))

          if violations:
              for path, line, label in violations:
                  print(f"Embedded secret pattern detected: {path}:{line} ({label})")
              sys.exit(1)

          print("No embedded release-secret patterns found in tracked non-test sources.")
          PY

      - name: Validate release unit tests and release build
        run: >
          gradle --no-daemon
          testDebugUnitTest
          testReleaseUnitTest
          lintRelease
          assembleRelease
          bundleRelease

      - name: Upload unsigned release artifacts and mapping
        uses: actions/upload-artifact@v4
        with:
          name: ritav-android-release-validation
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
