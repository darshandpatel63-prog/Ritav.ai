name: Windows platform runtime

on:
  pull_request:
    paths:
      - "core/**"
      - "build.gradle.kts"
      - ".github/workflows/windows-platform-test.yml"
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - "build.gradle.kts"
      - ".github/workflows/windows-platform-test.yml"

permissions:
  contents: read

concurrency:
  group: windows-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-platform:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Windows native target tests
        shell: pwsh
        run: gradle :core:mingwX64Test --no-daemon --stacktrace
